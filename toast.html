<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>DiceCloud Roller — notificação</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; }
      body { padding: 6px; font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; color: #f3f0fb; cursor: pointer; -webkit-font-smoothing: antialiased; }
      .card {
        position: relative; overflow: hidden;
        display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center;
        margin-bottom: 8px; padding: 10px 14px 10px 10px; border-radius: 14px;
        background: linear-gradient(180deg, #2a2440, #211c33);
        border: 1px solid rgba(187, 153, 255, 0.28);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        animation: drop 0.28s cubic-bezier(.2,.9,.3,1.2);
      }
      .card:last-child { margin-bottom: 0; }
      .badge {
        position: relative; width: 54px; height: 54px; display: grid; place-items: center;
        font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; color: #19122e;
      }
      .badge svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .badge span { position: relative; }
      .badge.portrait { border-radius: 50%; background-size: cover; background-position: center; box-shadow: 0 0 0 2px #ffd27a; }
      .who { font-size: 11.5px; color: #b9b0d6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .who b { color: #ece6ff; font-weight: 600; }
      .label { font-weight: 650; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
      .detail { font-size: 12px; color: #b9b0d6; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; margin-top: 1px; }
      .text { font-size: 12.5px; color: #d9d2ee; margin-top: 4px; line-height: 1.4; }
      .tag {
        display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; vertical-align: 1px;
        font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
      }
      .card.crit { border-color: rgba(111, 220, 150, 0.55); }
      .card.crit .tag { background: rgba(111, 220, 150, 0.18); color: #6fdc96; }
      .card.fumble { border-color: rgba(255, 138, 138, 0.55); }
      .card.fumble .tag { background: rgba(255, 138, 138, 0.18); color: #ff8a8a; }
      .card.use { border-color: rgba(255, 210, 122, 0.4); grid-template-columns: 44px 1fr; }
      .card.use .badge { width: 44px; height: 44px; }
      .card.crit::after, .card.fumble::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 30px 50%, rgba(111, 220, 150, 0.22), transparent 60%);
      }
      .card.fumble::after { background: radial-gradient(circle at 30px 50%, rgba(255, 138, 138, 0.22), transparent 60%); }
      @keyframes drop { from { opacity: 0; transform: translateY(-10px) scale(0.98); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
    </style>
    <script type="module" src="./toast.js"></script>
  </head>
  <body></body>
</html>
